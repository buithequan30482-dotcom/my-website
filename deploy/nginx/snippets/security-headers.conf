# Header bảo mật cho tệp do nginx phục vụ trực tiếp (static/media).
# Trang HTML do Django đặt CSP, X-Frame-Options, Referrer-Policy (core/middleware.py, settings.py).
add_header Strict-Transport-Security $vandon_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
