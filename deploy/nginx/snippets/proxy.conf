# Tham số proxy tới Django. X-Forwarded-For GHI ĐÈ bằng IP thật của kết nối
# (ứng dụng lấy phần tử đầu tiên của header này – không cho client giả mạo).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_buffers 16 32k;
proxy_buffer_size 32k;
# Nếu một container web đang dừng (khi cập nhật), thử container còn lại – chỉ với yêu cầu idempotent
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 3;
# HSTS do nginx gửi; bỏ bản do Django gửi để không bị trùng header
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Powered-By;
add_header Strict-Transport-Security $vandon_hsts always;
